<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login project cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="icon" type="image/png" sizes="32x32" href="img\logo\logo.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="img\logo\logo.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="style\style.css">
</head>
<body>
    
    <div class="progress-wheel" id="progressWheel">
        <div class="wheel-container">
            <div class="wheel"></div>
            <p id="wheelText">Processing...</p>
        </div>
    </div>
    <div class="auth-main-container">
        <div class="auth-login-container">
        <div id="login-form">
            <h1 class="login-massage">Please Login</h1>
            <div class="login-header">
            </div>
            <div id="login-message" class="message"></div>
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> USERNAME</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> PASSWORD</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password">
            </div>
            <div class="remember-forgot">
                <div class="checkbox-container">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <button type="button" id="loginButton" class="login-button">
                <i class="fas fa-sign-in-alt"></i> SIGN IN
            </button>
            <div class="divider">
                <span>Or continue with</span>
            </div>
            <div class="social-login">
                <div class="social-btn google" onclick="document.querySelector('.g_id_signin').click()">
                    <i class="fab fa-google" style="color: #DB4437; font-size: 20px;"></i>
                </div>
                <div class="social-btn facebook">
                    <i class="fab fa-facebook-f" style="color: #4267B2; font-size: 20px;"></i>
                </div>
                <div class="social-btn twitter">
                    <i class="fab fa-twitter" style="color: #1DA1F2; font-size: 20px;"></i>
                </div>
            </div>
            <div class="register-link">
                Don't have an account? <a href="#" id="showRegister">Create Account</a>
            </div>
        </div>
        <div id="register-form" style="display: none;">
            <div class="login-header">
            </div>            
            <div id="register-message" class="message"></div>           
            <div class="form-group">
                <label for="regUsername"><i class="fas fa-user-plus"></i> USERNAME</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Choose a username">
            </div>            
            <div class="form-group">
                <label for="regPassword"><i class="fas fa-lock"></i> PASSWORD</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Create a password (min 6 characters)">
            </div>
            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-lock"></i> CONFIRM PASSWORD</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password">
            </div>            
            <button type="button" id="registerButton" class="login-button">
                <i class="fas fa-user-plus"></i> CREATE ACCOUNT
            </button>
            <div class="divider">
                <span>Or sign up with</span>
            </div>
            <div class="social-login">
                <div class="social-btn google" onclick="document.querySelector('.g_id_signin').click()">
                    <i class="fab fa-google" style="color: #DB4437; font-size: 20px;"></i>
                </div>
                <div class="social-btn facebook">
                    <i class="fab fa-facebook-f" style="color: #4267B2; font-size: 20px;"></i>
                </div>
                <div class="social-btn twitter">
                    <i class="fab fa-twitter" style="color: #1DA1F2; font-size: 20px;"></i>
                </div>
            </div>            
            <div class="register-link">
                Already have an account? <a href="#" id="showLogin">Sign In</a>
            </div>
        </div>    
        <div id="g_id_onload"
            data-client_id="355247927664-7aaivt26oodtvtf4u2k658ifninmebq5.apps.googleusercontent.com"
            data-callback="handleGoogleLogin">
        </div>
        <div class="g_id_signin"
            data-type="standard"
            data-theme="outline"
            data-size="large"
            data-text="sign_in_with"
            data-shape="rectangular"
            data-logo_alignment="left">
        </div>
        </div>
        <div class="auth-image-container">
            <img src="https://i.pinimg.com/564x/98/68/87/986887527a4a11f5ccb4cf87d6d116e8.jpg">
        </div>
    </div>
</div>
  <script src="script\script.js" defer></script>
</body>
</html>
